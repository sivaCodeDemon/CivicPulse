server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: civicpulse-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/civicpulse}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET:4c8b92b6a55e2d8e578c73d9e83f21a4f0923d8c11e749a5b3f81e62a0459c27}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 Hours
  ai:
    duplicate-distance-meters-threshold: 75.0
    duplicate-similarity-threshold: 0.50
  storage:
    upload-dir: ${UPLOAD_DIR:./uploads}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
